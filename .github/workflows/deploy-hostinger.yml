name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install and build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: https://app.earlco.in
        run: |
          case "$VITE_STRIPE_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "Production deploy requires a live Stripe publishable key" >&2; exit 1 ;;
          esac
          npm ci --legacy-peer-deps
          npm run build
          if grep -R -q 'pk_test_' dist; then
            echo "Test Stripe credentials found in production bundle" >&2
            exit 1
          fi

      - name: Deploy to Hostinger via FTP
        env:
          FTP_HOST: hostinger.com
          FTP_IP: 157.173.209.157
          FTP_USER: u847403612.app.earlco.in
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PW }}
        run: |
          cd dist
          echo "Uploading files..."
          find . -type f | while read -r file; do
            clean_file="${file#./}"
            curl -T "$file" "ftp://${FTP_HOST}/${clean_file}" \
              --user "${FTP_USER}:${FTP_PASS}" \
              --resolve "${FTP_HOST}:21:${FTP_IP}" \
              --ssl-reqd --ftp-create-dirs --silent --show-error
          done

      - name: Clear Cloudflare cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
